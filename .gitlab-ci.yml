### Scripts ###
.activate_mise: &activate_mise
  - mise install
  - eval "$(mise env)"

.update_nuget_source_ro: &update_nuget_source_ro
  - dotnet nuget update source JFrogNuGetProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text

.update_nuget_source_rw: &update_nuget_source_rw
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_RW_JFrog -p $NuGet_PW_RW_JFrog --store-password-in-clear-text

.rules_tag: &rules_tag
  if: "$CI_COMMIT_TAG"

.rules: &rules
  <<: *rules_tag
  if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  if: $CI_PIPELINE_SOURCE == "merge_request_event"
  if: $CI_PIPELINE_SOURCE == "web"

.rules_manual: &rules_manual
    <<: *rules
    when: manual
    allow_failure: true

### Defaults ###
variables:
  IMAGE_NAME: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-latest
  RUNNER_TAG: saas-linux-small-amd64

stages:
  - build
  - test
  - pack
  - publish

Version:
  stage: .pre
  script:
    - if [[ -f "VERSION" ]]; then VERSION=$(head -n 1 VERSION); fi
    - if [[ ! -z "${CI_COMMIT_TAG}" ]]; then VERSION=$(echo $CI_COMMIT_TAG | sed 's/v//g'); fi
    - if [[ -z "${VERSION}" ]]; then VERSION='0.1.0'; fi
    - if [[ -z "${CI_COMMIT_TAG}" ]]; then VERSION="${VERSION}-ci${CI_PIPELINE_ID}"; fi
    - 'echo "Version=${VERSION}" >> version.env'
    - 'echo "PackageVersion=${VERSION}" >> version.env'
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env

### CI Components ###
include:
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-restore@2.1.1
    inputs:
      image: ${IMAGE_NAME}
      rules:
        - <<: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
      tags:
        - ${RUNNER_TAG}
  ### Test & Build
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-build@2.1.1
    inputs:
      image: ${IMAGE_NAME}
      rules:
        - <<: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
        - echo "$Version"
      tags:
        - ${RUNNER_TAG}
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-test@1.0.1
    inputs:
      image: ${IMAGE_NAME}
      rules:
        - <<: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
      tags:
        - ${RUNNER_TAG}
  ### NuGet Packages
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-pack@2.1.1
    inputs:
      image: ${IMAGE_NAME}
      rules:
        - <<: *rules_manual
      before_script:
        - *activate_mise
        - 'echo "PackageVersion: ${PackageVersion:-notAssigned}"'
      tags:
        - ${RUNNER_TAG}
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-nuget-push@2.1.1
    inputs:
      image: ${IMAGE_NAME}
      source: "JFrogViciOne"
      filename_pattern: "./src/*"
      rules:
        - <<: *rules_manual
      before_script:
        - *activate_mise
        - *update_nuget_source_rw
      tags:
        - ${RUNNER_TAG}
